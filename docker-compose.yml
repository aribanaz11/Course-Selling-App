version: "3.8"

services:
  app:
    build: .
    container_name: lumina-course-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - MONGO_URL=mongodb://mongodb:27017/course_app
      - JWT_USER_PASSWORD=lumina_user_secret_key_2026
      - JWT_ADMIN_PASSWORD=lumina_admin_secret_key_2026
    depends_on:
      - mongodb
    networks:
      - app-network

  mongodb:
    image: mongo:7-jammy
    container_name: lumina-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - app-network

volumes:
  mongo-data:
    driver: local

networks:
  app-network:
    driver: bridge
